plugins:
  - rubocop-rspec

# Keep RuboCop's default excludes (vendor/, node_modules/, .git/) alongside ours.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  UseCache: false
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"

Style/Documentation:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

RSpec:
  Enabled: true

RSpec/MultipleDescribes:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false
